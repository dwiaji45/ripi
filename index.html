<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesan RiPi Food</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2d6a4f">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Memanggil CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <img src="logo.png" alt="RiPi Food Logo" onerror="this.src='https://via.placeholder.com/150x60?text=RiPi+Food'">
    </header>

    <div class="fullscreen-container" id="fs-container">
        <button class="btn-fullscreen" onclick="bukaLayarPenuh()">
            Aplikasi Layar Penuh
        </button>
    </div>

    <!-- Peringatan Toko Tutup -->
    <div id="store-status" class="store-closed" style="display: none;">
        Maaf, toko sedang tutup. Jam operasional: 09:00 - 21:00 WIB.
    </div>

    <div class="container" id="menu-container">
        <!-- Rendered by JavaScript -->
    </div>

    <div class="container platforms-container">
        <div class="platforms">
            <div class="platform-title">JUGA TERSEDIA DI:</div>
            <div class="platform-logos">
                <img src="shopee_food.png" alt="Shopee Food" onerror="this.style.display='none'">
                <a href="https://gofood.link/a/TbNNw8S" target="_blank" rel="noopener noreferrer">
                    <img src="https://lelogama.go-jek.com/service_icon_text/gofood.svg" alt="Go Food" title="Pesan via GoFood" onerror="this.style.display='none'">
                </a>
                <img src="grab_food.png" alt="Grab Food" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <!-- Footer Keranjang -->
    <footer class="cart-footer">
        <div class="cart-container">
            <div>
                <div class="cart-total-label">Total Pembayaran:</div>
                <div class="cart-total-value" id="total-price">Rp 0</div>
            </div>
            <button class="btn-checkout" id="btn-checkout" onclick="openModal()" disabled>
                Pesan Sekarang
            </button>
        </div>
    </footer>

    <!-- Modal Ringkasan Pesanan -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">Ringkasan Pesanan</div>
            <div class="modal-body" id="order-summary">
                <!-- Ringkasan di-render via JS -->
            </div>
            
            <div class="modal-form">
                <label>Nama Pemesan *</label>
                <input type="text" id="input-name" placeholder="Masukkan nama Anda" required>
                
                <label>Meja / Alamat Pengiriman *</label>
                <input type="text" id="input-address" placeholder="Contoh: Meja 4 / Jl. Sudirman No 10" required>
                
                <label>Catatan (Opsional)</label>
                <textarea id="input-notes" rows="2" placeholder="Contoh: Esnya sedikit saja, jangan terlalu manis"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-confirm" onclick="checkoutWA()">Kirim via WA</button>
            </div>
        </div>
    </div>

    <!-- Script Terpisah -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
